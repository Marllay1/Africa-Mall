
<style>
#erd { padding: 1rem 0; }
#erd svg { width: 100%; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const diagram = `erDiagram
  USERS {
    uuid id PK
    string name
    string email
    string password
    enum role "client|seller|admin"
    string phone
    string avatar
    boolean is_active
    timestamp created_at
  }
  SHOPS {
    uuid id PK
    uuid user_id FK
    string name
    string slug
    string description
    string logo
    enum status "pending|active|suspended"
    enum plan "standard|premium"
    float commission_rate
    timestamp created_at
  }
  CATEGORIES {
    uuid id PK
    uuid parent_id FK
    string name
    string slug
    string icon
    integer sort_order
  }
  PRODUCTS {
    uuid id PK
    uuid shop_id FK
    uuid category_id FK
    string name
    string slug
    text description
    float base_price
    boolean is_featured
    boolean is_sponsored
    enum status "draft|active|rejected"
    timestamp created_at
  }
  PRODUCT_VARIANTS {
    uuid id PK
    uuid product_id FK
    string size
    string color
    float price
    integer stock
    string sku
  }
  PRODUCT_IMAGES {
    uuid id PK
    uuid product_id FK
    string url
    boolean is_main
    integer sort_order
  }
  ORDERS {
    uuid id PK
    uuid user_id FK
    float subtotal
    float delivery_fee
    float total
    float commission_amount
    enum status "pending|paid|shipped|delivered|cancelled"
    string delivery_address
    timestamp created_at
  }
  ORDER_ITEMS {
    uuid id PK
    uuid order_id FK
    uuid product_variant_id FK
    uuid shop_id FK
    integer quantity
    float unit_price
    float subtotal
  }
  PAYMENTS {
    uuid id PK
    uuid order_id FK
    string provider
    string transaction_id
    float amount
    enum status "pending|success|failed"
    timestamp paid_at
  }
  CARTS {
    uuid id PK
    uuid user_id FK
    uuid product_variant_id FK
    integer quantity
    timestamp updated_at
  }
  REVIEWS {
    uuid id PK
    uuid user_id FK
    uuid product_id FK
    integer rating
    text comment
    timestamp created_at
  }
  SUBSCRIPTIONS {
    uuid id PK
    uuid shop_id FK
    string plan
    float price
    timestamp starts_at
    timestamp ends_at
    enum status "active|expired|cancelled"
  }
  CAROUSELS {
    uuid id PK
    uuid product_id FK
    string image_url
    string title
    integer sort_order
    boolean is_active
    timestamp created_at
  }
  MESSAGES {
    uuid id PK
    uuid sender_id FK
    uuid receiver_id FK
    uuid shop_id FK
    text content
    boolean is_read
    timestamp created_at
  }
  USER_BEHAVIORS {
    uuid id PK
    uuid user_id FK
    uuid product_id FK
    uuid category_id FK
    enum action "view|search|click|purchase"
    string search_query
    timestamp created_at
  }
  NOTIFICATIONS {
    uuid id PK
    uuid user_id FK
    string title
    string body
    enum type "order|payment|message|system"
    boolean is_read
    timestamp created_at
  }

  USERS ||--o{ SHOPS : "owns"
  USERS ||--o{ ORDERS : "places"
  USERS ||--o{ CARTS : "has"
  USERS ||--o{ REVIEWS : "writes"
  USERS ||--o{ MESSAGES : "sends"
  USERS ||--o{ USER_BEHAVIORS : "generates"
  USERS ||--o{ NOTIFICATIONS : "receives"
  SHOPS ||--o{ PRODUCTS : "publishes"
  SHOPS ||--o{ ORDER_ITEMS : "receives"
  SHOPS ||--o{ SUBSCRIPTIONS : "subscribes"
  SHOPS ||--o{ MESSAGES : "involved"
  CATEGORIES ||--o{ PRODUCTS : "contains"
  CATEGORIES ||--o{ CATEGORIES : "parent"
  CATEGORIES ||--o{ USER_BEHAVIORS : "tracked"
  PRODUCTS ||--o{ PRODUCT_VARIANTS : "has"
  PRODUCTS ||--o{ PRODUCT_IMAGES : "has"
  PRODUCTS ||--o{ REVIEWS : "receives"
  PRODUCTS ||--o{ CAROUSELS : "featured"
  PRODUCTS ||--o{ USER_BEHAVIORS : "tracked"
  PRODUCT_VARIANTS ||--o{ ORDER_ITEMS : "included"
  PRODUCT_VARIANTS ||--o{ CARTS : "in"
  ORDERS ||--o{ ORDER_ITEMS : "contains"
  ORDERS ||--|| PAYMENTS : "paid via"
`;
const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
